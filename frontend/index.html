<style>
:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--pk:#ff3d81;--ink:#1b0033;--lime:#c6ff00;--sky:#5ad2ff;--w:#fff6fb}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--pk);color:var(--ink);font-family:'Outfit',sans-serif;font-size:16px;overflow-x:hidden;cursor:none;line-height:1.45}
@media(hover:none){body{cursor:auto}.cur{display:none}}
.mono{font-family:ui-monospace,Menlo,monospace}
h1,h2{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;line-height:.88}
a,button,input,select{cursor:none}@media(hover:none){a,button,input,select{cursor:auto}}
.cur{position:fixed;left:0;top:0;width:34px;height:34px;border:3px solid var(--ink);border-radius:50%;pointer-events:none;z-index:200;transition:width .2s,height .2s,background .2s,margin .2s;mix-blend-mode:normal;margin:-17px 0 0 -17px}
.cur.h{width:70px;height:70px;margin:-35px 0 0 -35px;background:var(--lime)}
nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.logo{font-family:Anton;font-size:26px;background:var(--ink);color:var(--lime);padding:2px 12px;transform:rotate(-3deg)}
.nr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--w);border:3px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
select.pill{padding:4px 8px}
.btn{background:var(--lime);border:3px solid var(--ink);border-radius:99px;padding:10px 20px;font:700 15px Outfit;box-shadow:0 5px 0 var(--ink);transition:.12s;color:var(--ink)}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sky{background:var(--sky)}.btn.k{background:var(--ink);color:var(--lime)}
.hero{min-height:100vh;padding:100px 14px 30px;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hero h1{font-size:clamp(90px,23vw,380px);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:3px var(--ink);transform:rotate(-4deg) translateX(-2vw);position:relative}
.hero h1 b{display:block;font-weight:400;color:var(--ink);-webkit-text-stroke:0;margin-left:14vw;transform:rotate(2deg)}
.hero h1 span{position:absolute;inset:0;color:var(--lime);-webkit-text-stroke:0;clip-path:inset(0 calc(100% - var(--s,0%)) 0 0);transition:clip-path .1s}
.badge-r{position:absolute;right:4vw;top:18vh;width:clamp(110px,16vw,210px);animation:sp 14s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.badge-r text{font:700 15px Outfit;letter-spacing:3px;fill:var(--ink)}
.launched{align-self:flex-start;background:var(--ink);color:var(--lime);font:700 clamp(14px,2.4vw,22px) Outfit;padding:12px 20px;border-radius:99px;margin-top:20px;transform:rotate(1.5deg)}
.mq{background:var(--ink);color:var(--lime);transform:rotate(-2deg) scale(1.05);margin:20px 0;overflow:hidden;white-space:nowrap;font:400 38px Anton;text-transform:uppercase}
.mq div{display:inline-block;padding:8px 0;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{opacity:0;transform:translateY(60px) rotate(var(--rot,0deg)) scale(.9);transition:.8s cubic-bezier(.3,1.5,.5,1)}.rv.in{opacity:1;transform:rotate(var(--rot,0deg))}
section{padding:70px 14px}
h2{font-size:clamp(54px,11vw,170px);margin-bottom:24px}
.split{display:grid;grid-auto-flow:dense;grid-template-columns:1.1fr .9fr;gap:30px;align-items:start}
.card{background:var(--w);border:4px solid var(--ink);border-radius:26px;padding:24px;box-shadow:10px 10px 0 var(--ink)}
.card label{display:block;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:12px 0 4px}
.card input{width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font:inherit;background:#fff;outline:0}.card input:focus{background:var(--lime)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sticker{aspect-ratio:1;max-width:380px;background:var(--sky);border:4px solid var(--ink);border-radius:50% 50% 50% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transform:rotate(6deg);transition:transform .3s;box-shadow:10px 10px 0 var(--ink);justify-self:center;width:100%}
.sticker:hover{transform:rotate(-4deg) scale(1.04)}
.sticker .n{font:400 clamp(34px,6vw,64px)/.9 Anton;text-transform:uppercase;word-break:break-word}.sticker .s{font:700 18px Outfit;background:var(--ink);color:var(--lime);padding:2px 12px;border-radius:99px;margin:8px 0}
.track{position:relative;height:44px;border:4px solid var(--ink);border-radius:99px;background:var(--w);margin:20px 0 6px;overflow:visible}
.fill{height:100%;background:repeating-linear-gradient(45deg,var(--lime) 0 12px,#d9ff4d 12px 24px);border-radius:99px;width:0;transition:width 1s cubic-bezier(.3,1.4,.5,1)}
.rocket{position:absolute;top:-20px;font-size:40px;left:0;transition:left 1s cubic-bezier(.3,1.4,.5,1);transform:translateX(-50%) rotate(45deg)}
.row{display:flex;justify-content:space-between;font-weight:700;flex-wrap:wrap;gap:8px}
.cols{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}
.mini{flex:1 1 150px;background:var(--w);border:4px solid var(--ink);border-radius:20px;padding:14px;box-shadow:5px 5px 0 var(--ink);text-align:left;transition:.2s;font:inherit;color:var(--ink)}
.mini:nth-child(odd){transform:rotate(-2deg)}.mini:nth-child(even){transform:rotate(2.5deg);background:var(--lime)}.mini:hover{transform:rotate(0) translateY(-6px)}
.mini b{font:400 26px Anton;text-transform:uppercase;display:block}
.out{margin-top:14px;background:var(--ink);color:var(--lime);border-radius:14px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all}
.conf{position:fixed;width:12px;height:12px;pointer-events:none;z-index:150;border-radius:2px}
footer{background:var(--ink);color:var(--w);padding:26px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}footer a{color:var(--lime)}
#toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-160px) rotate(-2deg);background:var(--lime);border:3px solid var(--ink);border-radius:20px;padding:12px 22px;font-weight:700;z-index:99;transition:.4s cubic-bezier(.3,1.5,.5,1);max-width:92vw;box-shadow:0 6px 0 var(--ink)}
#toast.on{transform:translate(-50%,0) rotate(-2deg)}#toast[data-kind=err]{background:#fff;color:#c00}
.x svg{width:14px;height:14px;fill:currentColor}
@media(max-width:800px){.split{grid-template-columns:1fr}.hero h1 b{margin-left:6vw}.badge-r{top:12vh}.card{box-shadow:6px 6px 0 var(--ink)}}

@media(prefers-reduced-motion:reduce){.rv{transition:none!important;opacity:1;transform:none!important}*{animation:none!important}}
